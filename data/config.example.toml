# qam configuration
#
# Press Alt+Q to open the wheel, flick the mouse towards a slice and release
# Alt to pick it. Number keys 1-9 pick directly, Tab cycles wheels, Esc closes.
# Press E inside the wheel to edit slices without leaving the keyboard.
#
# Item types:
#   snippet  copy the value to the clipboard   (the everyday one)
#   command  run the value
#   app      launch a desktop application, e.g. "firefox.desktop"
#   path     open a file or folder
#   uri      open a URL
#   wheel    jump to another wheel by its id

[settings]
hotkey = "<Alt>q"
default_wheel = "main"
notify = true

[[wheel]]
id = "main"
name = "Main"

  [[wheel.item]]
  label = "Firefox"
  type = "app"
  value = "firefox.desktop"

  [[wheel.item]]
  label = "Home"
  type = "path"
  value = "~"

  [[wheel.item]]
  label = "Documents"
  type = "path"
  value = "~/Documents"

  [[wheel.item]]
  label = "Downloads"
  type = "path"
  value = "~/Downloads"

  [[wheel.item]]
  label = "Terminal"
  type = "command"
  value = "x-terminal-emulator"

  [[wheel.item]]
  label = "Dev"
  type = "wheel"
  value = "dev"

[[wheel]]
id = "dev"
name = "Dev"

  [[wheel.item]]
  label = "VS Code"
  type = "app"
  value = "code.desktop"

  [[wheel.item]]
  label = "PyCharm"
  type = "app"
  value = "pycharm.desktop"

  [[wheel.item]]
  label = "Main"
  type = "wheel"
  value = "main"
